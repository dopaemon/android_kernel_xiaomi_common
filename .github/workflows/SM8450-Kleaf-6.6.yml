name: SM8450 6.6 | DoraCore Kleaf AnyKernel3 (boot, vendor_boot, dtbo, vendor_dlkm)

# Builds DoraCore for Xiaomi SM8450/SM8475/SM7475 with Kleaf, the same way
# LineageOS builds TARGET_KERNEL_PLATFORM_TARGET (vendor/lineage/build/
# tasks/kernel.mk), without the full Android tree.  Everything SM8450 comes
# from the DoraCore tree: the msm kernel itself plus the subtrees
#   arch/arm64/boot/dts/vendor    (sm8450-devicetrees-6.6)
#   vendor/xiaomi/sm8450-modules  (sm8450-modules-6.6)
#   vendor/xiaomi/sm8450-build    (sm8450-build-6.6, BUILD.bazel)
#   vendor/xiaomi/sm8450-common   (module load lists and blocklists)
# which are mapped onto the Kleaf platform paths the BUILD files use.
# The result is an AnyKernel3 zip: boot and vendor_boot are patched on the
# device (kernel, dtb, vendor ramdisk modules), dtbo, vendor_dlkm and
# system_dlkm are flashed whole.

on:
  workflow_dispatch:
    inputs:
      BUILD_DEVICE:
        description: 'Device (audio-kernel target_product)'
        required: true
        default: 'mayfly'
        type: choice
        options:
        - all
        - cupid
        - diting
        - marble
        - mayfly
        - mondrian
        - thor
        - unicorn
        - zeus
        - zizhan
      KERNEL_GIT:
        description: 'DoraCore source'
        required: true
        default: 'https://github.com/dopaemon/android_kernel_xiaomi_common.git'
      KERNEL_BRANCH:
        description: 'DoraCore branch'
        required: true
        default: 'Rebase-6.6'
      BUILD_TARGET:
        description: 'KernelSU'
        required: true
        default: 'KSU'
        type: choice
        options:
        - KSU
        - NonKSU
      LTO_MODE:
        description: 'Kleaf --lto'
        required: true
        default: 'thin'
        type: choice
        options:
        - default
        - thin
        - full
        - none
      RELEASE:
        description: 'Status Release'
        required: true
        default: 'draft'
        type: choice
        options:
        - draft
        - prerelease
        - release

jobs:
  create_release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Set tag as timestamp
        id: set-tag
        run: echo "tag=sm8450-$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.set-tag.outputs.tag }}
          name: DoraCore SM8450 6.6 Images ${{ steps.set-tag.outputs.tag }}
          draft: ${{ github.event.inputs.RELEASE == 'draft' }}
          prerelease: ${{ github.event.inputs.RELEASE == 'prerelease' }}
          make_latest: ${{ github.event.inputs.RELEASE == 'release' }}
          body: |
            DoraCore full kernel for Xiaomi SM8450/SM8475/SM7475 (Linux 6.6, Kleaf).
            Source: ${{ github.event.inputs.KERNEL_GIT }} (${{ github.event.inputs.KERNEL_BRANCH }}), ${{ github.event.inputs.BUILD_TARGET }}
            AnyKernel3 zip: boot (Image), vendor_boot (dtb + ramdisk modules), dtbo, vendor_dlkm, system_dlkm.
            Credits: cupid-development, ArianK16a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create_release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(github.event.inputs.BUILD_DEVICE == 'all' && '["cupid","diting","marble","mayfly","mondrian","thor","unicorn","zeus","zizhan"]' || format('["{0}"]', github.event.inputs.BUILD_DEVICE)) }}

    env:
      DEVICE: ${{ matrix.device }}
      LINEAGE_BRANCH: lineage-24.0
      SRC: ${{ github.workspace }}/src
      KP: ${{ github.workspace }}/src/kernel/platform/kernel-6.6
      KERNEL_SRC: ${{ github.workspace }}/src/kernel/platform/kernel-6.6/vendor/xiaomi/sm8450-kernel
      MODULE_LISTS: ${{ github.workspace }}/src/kernel/platform/kernel-6.6/vendor/xiaomi/sm8450-kernel/vendor/xiaomi/sm8450-common
      DIST: ${{ github.workspace }}/dist
      PACK_OUT: ${{ github.workspace }}/ak3-payload
      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: true

      - name: Setup Swap
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 32G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 32767 /swapfile
          sudo sysctl -w vm.swappiness=200
          swapon --show
          df -BG

      - name: Build Environment
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(TZ=Asia/Ho_Chi_Minh date +'%Y-%m%d-%H%M')" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl python3 python-is-python3 aria2 unzip zip lz4 cpio \
            e2fsprogs attr kmod util-linux \
            bc bison flex make libssl-dev libelf-dev dwarves binutils-aarch64-linux-gnu
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 5 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync Kernel Platform
        run: |
          set -euo pipefail
          MR="$RUNNER_TEMP/manifest"
          mkdir -p "$MR" "$SRC"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/kernel-6.6.xml" \
            "https://raw.githubusercontent.com/LineageOS/android/$LINEAGE_BRANCH/snippets/kernel-6.6.xml"
          python3 tools/ci/sm8450_manifest.py "$RUNNER_TEMP/kernel-6.6.xml" "$MR/default.xml"
          cat "$MR/default.xml"
          git -C "$MR" init -q -b main
          git -C "$MR" add default.xml
          git -C "$MR" commit -q -m "kernel-6.6 Kleaf platform"
          cd "$SRC"
          repo init -u "file://$MR" -b main --depth=1 --no-clone-bundle
          repo sync -c -j8 --no-tags --no-clone-bundle --optimized-fetch --force-sync --fail-fast
          repo forall -c 'echo "$REPO_PATH $(git rev-parse --short=12 HEAD)"'
          df -BG

      - name: Clone DoraCore
        run: |
          set -euo pipefail
          git clone -b "${{ github.event.inputs.KERNEL_BRANCH }}" --single-branch --depth=1 --no-tags \
            --recurse-submodules --shallow-submodules \
            "${{ github.event.inputs.KERNEL_GIT }}" "$KERNEL_SRC"
          cd "$KERNEL_SRC"
          echo "DoraCore: $(make -s kernelversion) @ $(git rev-parse --short=12 HEAD)"
          for d in arch/arm64/boot/dts/vendor vendor/xiaomi/sm8450-modules vendor/xiaomi/sm8450-build; do
            [ -f "$d/BUILD.bazel" ] || [ -d "$d/qcom" ] || { echo "DoraCore tree has no $d subtree" >&2; exit 1; }
          done
          for f in modules.load modules.load.vendor_boot modules.blocklist modules.blocklist.system_dlkm; do
            [ -s "$MODULE_LISTS/$f" ] || { echo "DoraCore tree has no $MODULE_LISTS/$f" >&2; exit 1; }
          done
          # The BUILD files keep the Kleaf platform labels
          # (//vendor/xiaomi/sm8450-{kernel,modules,build}); map those paths
          # onto the DoraCore subtrees.
          cd "$KP/vendor/xiaomi"
          ln -sfn sm8450-kernel/vendor/xiaomi/sm8450-modules sm8450-modules
          ln -sfn sm8450-kernel/vendor/xiaomi/sm8450-build sm8450-build
          ln -sfn sm8450-kernel/arch/arm64/boot/dts/vendor sm8450-devicetrees
          ls -l "$KP/vendor/xiaomi"

      - name: Prepare gki_defconfig
        run: |
          set -euo pipefail
          cd "$KERNEL_SRC"
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          if [ "${{ github.event.inputs.BUILD_TARGET }}" = NonKSU ]; then
            sed -i -e '/^CONFIG_KSU[_=]/d' -e '/^# CONFIG_KSU[_ ].* is not set$/d' "$DEFCONFIG"
            echo "# CONFIG_KSU is not set" >> "$DEFCONFIG"
          fi
          grep -n 'CONFIG_KSU\b' "$DEFCONFIG"
          # build.config.gki runs check_defconfig, which wants gki_defconfig
          # to equal "make savedefconfig" byte for byte. DoraCore appends its
          # options (KSU, SUSFS, ...) instead of keeping savedefconfig order,
          # so drop the check for this build; olddefconfig still resolves the
          # same .config from it.
          grep -qx 'POST_DEFCONFIG_CMDS="check_defconfig"' build.config.gki
          sed -i 's/^POST_DEFCONFIG_CMDS="check_defconfig"$/POST_DEFCONFIG_CMDS=""/' build.config.gki
          git diff --stat

      - name: Build With Kleaf
        run: |
          set -euo pipefail
          cd "$KP"
          # Same as vendor/lineage/build/tools/kernel_kleaf_manifest.py
          {
            echo '<manifest>'
            sed -n 's|^kernel/platform/kernel-6.6/\(.*\)$|  <project path="\1" />|p' "$SRC/.repo/project.list"
            for p in sm8450-kernel sm8450-modules sm8450-build sm8450-devicetrees; do
              echo "  <project path=\"vendor/xiaomi/$p\" />"
            done
            echo '</manifest>'
          } > "$RUNNER_TEMP/kleaf-manifest.xml"
          LTO_ARGS=()
          [ "${{ github.event.inputs.LTO_MODE }}" = default ] || LTO_ARGS=(--lto=${{ github.event.inputs.LTO_MODE }})
          ( while sleep 60; do
              printf '[monitor] %s | %s | disk %s\n' "$(date +%T)" \
                "$(free -m | awk '/Mem:/ {print "RAM " $3 "/" $2 " MiB"} /Swap:/ {print "SWAP " $3 "/" $2 " MiB"}' | paste -sd' ')" \
                "$(df -h --output=used,size / | tail -1)"
            done ) &
          MON=$!
          set +e
          ./tools/bazel run \
            --experimental_convenience_symlinks=ignore \
            --cpu=arm64 \
            --repo_manifest="$KP:$RUNNER_TEMP/kleaf-manifest.xml" \
            --config=stamp \
            --debug_make_verbosity=I \
            "${LTO_ARGS[@]}" \
            --//vendor/xiaomi/sm8450-modules/qcom/opensource/audio-kernel:target_product=$DEVICE \
            //vendor/xiaomi/sm8450-build:sm8450_dist \
            -- --destdir="$DIST" 2>&1 | tee "$GITHUB_WORKSPACE/build-$DEVICE-kleaf.log"
          RC=${PIPESTATUS[0]}
          set -e
          kill "$MON" || true
          [ "$RC" = 0 ] || exit "$RC"
          ls "$DIST" | head -100 || true
          echo "Modules: $(ls "$DIST"/*.ko | wc -l)"
          strings "$DIST/Image" | grep -m1 'Linux version' || true

      - name: Pack Images
        run: |
          set -euo pipefail
          OUT="$PACK_OUT" \
            bash tools/ci/sm8450_pack.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-$DEVICE-pack.log"

      - name: Create AnyKernel3 Zip
        run: |
          set -euo pipefail
          AK3="$GITHUB_WORKSPACE/AnyKernel3"
          # Upstream AnyKernel3 (pinned): its magiskboot handles the hdr v4
          # vendor_boot ramdisk table ("dlkm" fragment).
          git init -q "$AK3"
          git -C "$AK3" fetch -q --depth=1 "$AK3_REPO" "$AK3_COMMIT"
          git -C "$AK3" checkout -q FETCH_HEAD
          rm -rf "$AK3/.git" "$AK3/.github" "$AK3/README.md" "$AK3/modules" "$AK3/patch" "$AK3/ramdisk"
          curl -fsSL --retry 5 -o "$AK3/banner" \
            https://raw.githubusercontent.com/dopaemon/Anykernel3/master/banner
          sed -i -e 's/5\.10\.y - GKI/6.6.y - SM8450 Kleaf/' "$AK3/banner"
          KERNEL_STRING="DoraCore SM8450 6.6 (${{ github.event.inputs.BUILD_TARGET }}) for $DEVICE by dopaemon"
          sed -e "s|@DEVICE@|$DEVICE|" -e "s|@KERNEL_STRING@|$KERNEL_STRING|" \
            tools/ci/sm8450_anykernel.sh > "$AK3/anykernel.sh"
          cp -r "$PACK_OUT"/. "$AK3/"
          cd "$AK3"
          find . -type f ! -name '*.ko' | sort
          ZIP_NAME="DoraCore-${DEVICE}-SM8450-6.6-${{ github.event.inputs.BUILD_TARGET }}-AK3-${BUILD_DATE}.zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '.git*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create_release.outputs.tag }}
          draft: ${{ github.event.inputs.RELEASE == 'draft' }}
          prerelease: ${{ github.event.inputs.RELEASE == 'prerelease' }}
          make_latest: ${{ github.event.inputs.RELEASE == 'release' }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.DEVICE }}-sm8450-logs
          path: ${{ github.workspace }}/build-*.log
          if-no-files-found: ignore
