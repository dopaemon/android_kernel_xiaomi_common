name: SM8450 6.6 | Kleaf AnyKernel3 (boot, vendor_boot, dtbo, vendor_dlkm)

# Builds the cupid-development SM8450 kernel platform
# (android_kernel_xiaomi_sm8450-build-6.6) the same way LineageOS does
# (vendor/lineage/build/tasks/kernel.mk, TARGET_KERNEL_PLATFORM_TARGET),
# without the full Android tree, and packs everything into an AnyKernel3
# zip: boot and vendor_boot are patched on the device (kernel, dtb, vendor
# ramdisk modules), dtbo, vendor_dlkm and system_dlkm are flashed whole.

on:
  workflow_dispatch:
    inputs:
      BUILD_DEVICE:
        description: 'Device (audio-kernel target_product)'
        required: true
        default: 'mayfly'
        type: choice
        options:
        - all
        - cupid
        - diting
        - marble
        - mayfly
        - mondrian
        - thor
        - unicorn
        - zeus
        - zizhan
      CUPID_BRANCH:
        description: 'cupid-development branch'
        required: true
        default: 'lineage-24.0-6.6'
      BOOT_KERNEL:
        description: 'Kernel inside boot.img'
        required: true
        default: 'cupid'
        type: choice
        options:
        - cupid
        - DoraCore-KSU
        - DoraCore-NonKSU
      KERNEL_GIT:
        description: 'DoraCore source (only for DoraCore boot kernel)'
        required: true
        default: 'https://github.com/dopaemon/android_kernel_xiaomi_common.git'
      KERNEL_BRANCH:
        description: 'DoraCore branch (only for DoraCore boot kernel)'
        required: true
        default: 'Rebase-6.6'
      LTO_MODE:
        description: 'Kleaf --lto'
        required: true
        default: 'thin'
        type: choice
        options:
        - default
        - thin
        - full
        - none
      RELEASE:
        description: 'Status Release'
        required: true
        default: 'draft'
        type: choice
        options:
        - draft
        - prerelease
        - release

jobs:
  create_release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Set tag as timestamp
        id: set-tag
        run: echo "tag=sm8450-$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.set-tag.outputs.tag }}
          name: DoraCore SM8450 6.6 Images ${{ steps.set-tag.outputs.tag }}
          draft: ${{ github.event.inputs.RELEASE == 'draft' }}
          prerelease: ${{ github.event.inputs.RELEASE == 'prerelease' }}
          make_latest: ${{ github.event.inputs.RELEASE == 'release' }}
          body: |
            Full kernel images for Xiaomi SM8450/SM8475/SM7475 (Linux 6.6, Kleaf).
            Source: cupid-development/android_kernel_xiaomi_sm8450-build-6.6 (${{ github.event.inputs.CUPID_BRANCH }})
            boot.img kernel: ${{ github.event.inputs.BOOT_KERNEL }}
            AnyKernel3 zip: boot (Image), vendor_boot (dtb + ramdisk modules), dtbo, vendor_dlkm, system_dlkm.
            Credits: cupid-development, ArianK16a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create_release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(github.event.inputs.BUILD_DEVICE == 'all' && '["cupid","diting","marble","mayfly","mondrian","thor","unicorn","zeus","zizhan"]' || format('["{0}"]', github.event.inputs.BUILD_DEVICE)) }}

    env:
      DEVICE: ${{ matrix.device }}
      CUPID_BRANCH: ${{ github.event.inputs.CUPID_BRANCH }}
      LINEAGE_BRANCH: lineage-24.0
      SRC: ${{ github.workspace }}/src
      KP: ${{ github.workspace }}/src/kernel/platform/kernel-6.6
      DIST: ${{ github.workspace }}/dist
      PACK_OUT: ${{ github.workspace }}/ak3-payload
      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: true

      - name: Setup Swap
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 32G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 32767 /swapfile
          sudo sysctl -w vm.swappiness=200
          swapon --show
          df -BG

      - name: Build Environment
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(TZ=Asia/Ho_Chi_Minh date +'%Y-%m%d-%H%M')" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl python3 python-is-python3 aria2 unzip zip lz4 cpio \
            e2fsprogs attr kmod util-linux \
            bc bison flex make libssl-dev libelf-dev dwarves binutils-aarch64-linux-gnu
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 5 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync Kernel Platform
        run: |
          set -euo pipefail
          MR="$RUNNER_TEMP/manifest"
          mkdir -p "$MR" "$SRC"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/kernel-6.6.xml" \
            "https://raw.githubusercontent.com/LineageOS/android/$LINEAGE_BRANCH/snippets/kernel-6.6.xml"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/sm8450-manifest.xml" \
            "https://raw.githubusercontent.com/cupid-development/android_kernel_xiaomi_sm8450-build-6.6/$CUPID_BRANCH/sm8450-manifest.xml"
          python3 tools/ci/sm8450_manifest.py "$RUNNER_TEMP/kernel-6.6.xml" \
            "$RUNNER_TEMP/sm8450-manifest.xml" "$MR/default.xml"
          sed -i "s|revision=\"lineage-24.0-6.6\"|revision=\"$CUPID_BRANCH\"|g" "$MR/default.xml"
          cat "$MR/default.xml"
          git -C "$MR" init -q -b main
          git -C "$MR" add default.xml
          git -C "$MR" commit -q -m "sm8450 kernel platform"
          cd "$SRC"
          repo init -u "file://$MR" -b main --depth=1 --no-clone-bundle
          repo sync -c -j8 --no-tags --no-clone-bundle --optimized-fetch --force-sync --fail-fast
          repo forall -c 'echo "$REPO_PATH $(git rev-parse --short=12 HEAD)"'
          df -BG

      - name: Clone device/xiaomi/sm8450-common
        run: |
          git clone --depth=1 -b "$CUPID_BRANCH" \
            https://github.com/cupid-development/android_device_xiaomi_sm8450-common.git \
            "$GITHUB_WORKSPACE/device-common"

      - name: Build With Kleaf
        run: |
          set -euo pipefail
          cd "$KP"
          # Same as vendor/lineage/build/tools/kernel_kleaf_manifest.py
          {
            echo '<manifest>'
            sed -n 's|^kernel/platform/kernel-6.6/\(.*\)$|  <project path="\1" />|p' "$SRC/.repo/project.list"
            echo '</manifest>'
          } > "$RUNNER_TEMP/kleaf-manifest.xml"
          LTO_ARGS=()
          [ "${{ github.event.inputs.LTO_MODE }}" = default ] || LTO_ARGS=(--lto=${{ github.event.inputs.LTO_MODE }})
          ( while sleep 60; do
              printf '[monitor] %s | %s | disk %s\n' "$(date +%T)" \
                "$(free -m | awk '/Mem:/ {print "RAM " $3 "/" $2 " MiB"} /Swap:/ {print "SWAP " $3 "/" $2 " MiB"}' | paste -sd' ')" \
                "$(df -h --output=used,size / | tail -1)"
            done ) &
          MON=$!
          set +e
          ./tools/bazel run \
            --experimental_convenience_symlinks=ignore \
            --cpu=arm64 \
            --repo_manifest="$KP:$RUNNER_TEMP/kleaf-manifest.xml" \
            --config=stamp \
            "${LTO_ARGS[@]}" \
            --//vendor/xiaomi/sm8450-modules/qcom/opensource/audio-kernel:target_product=$DEVICE \
            //vendor/xiaomi/sm8450-build:sm8450_dist \
            -- --destdir="$DIST" 2>&1 | tee "$GITHUB_WORKSPACE/build-$DEVICE-kleaf.log"
          RC=${PIPESTATUS[0]}
          set -e
          kill "$MON" || true
          [ "$RC" = 0 ] || exit "$RC"
          ls "$DIST" | head -100 || true
          echo "Modules: $(ls "$DIST"/*.ko | wc -l)"
          strings "$DIST/Image" | grep -m1 'Linux version' || true

      - name: Build DoraCore Image
        if: startsWith(github.event.inputs.BOOT_KERNEL, 'DoraCore')
        run: |
          set -euo pipefail
          git clone -b "${{ github.event.inputs.KERNEL_BRANCH }}" --single-branch --depth=1 --no-tags \
            --recurse-submodules --shallow-submodules \
            "${{ github.event.inputs.KERNEL_GIT }}" "$GITHUB_WORKSPACE/doracore"
          cd "$GITHUB_WORKSPACE/doracore"
          CLANG_VERSION=$(sed -n 's/^CLANG_VERSION=//p' build.config.constants | head -n1)
          CLANG_DIR="$KP/prebuilts/clang/host/linux-x86/clang-$CLANG_VERSION"
          [ -x "$CLANG_DIR/bin/clang" ] || { echo "clang-$CLANG_VERSION not in kernel platform prebuilts" >&2; exit 1; }
          export PATH="$CLANG_DIR/bin:$PATH"
          OUT_DIR="$GITHUB_WORKSPACE/doracore-out"
          MAKE_ARGS=(-j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
                     LD=ld.lld HOSTLD=ld.lld LOCALVERSION= O="$OUT_DIR")
          case "${{ github.event.inputs.BOOT_KERNEL }}" in
            DoraCore-KSU) KSU_SWITCH=-e; KSU_EXPECT="CONFIG_KSU=y" ;;
            *) KSU_SWITCH=-d; KSU_EXPECT="# CONFIG_KSU is not set" ;;
          esac
          # This build cannot sign modules with the GKI key, so the stock
          # system_dlkm modules would be refused the protected exports.
          rm -f ./android/abi_gki_protected_exports_*
          make "${MAKE_ARGS[@]}" gki_defconfig
          scripts/config --file "$OUT_DIR/.config" "$KSU_SWITCH" KSU \
            -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG_THIN
          make "${MAKE_ARGS[@]}" olddefconfig
          grep -qxF "$KSU_EXPECT" "$OUT_DIR/.config"
          make "${MAKE_ARGS[@]}" Image 2>&1 | tee "$GITHUB_WORKSPACE/build-$DEVICE-doracore.log"
          echo "KERNEL_IMAGE=$OUT_DIR/arch/arm64/boot/Image" >> $GITHUB_ENV
          echo "DoraCore release: $(cat "$OUT_DIR/include/config/kernel.release")"

      - name: Pack Images
        run: |
          set -euo pipefail
          DEVICE_COMMON="$GITHUB_WORKSPACE/device-common" OUT="$PACK_OUT" \
            bash tools/ci/sm8450_pack.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-$DEVICE-pack.log"

      - name: Create AnyKernel3 Zip
        run: |
          set -euo pipefail
          AK3="$GITHUB_WORKSPACE/AnyKernel3"
          # Upstream AnyKernel3 (pinned): its magiskboot handles the hdr v4
          # vendor_boot ramdisk table ("dlkm" fragment).
          git init -q "$AK3"
          git -C "$AK3" fetch -q --depth=1 "$AK3_REPO" "$AK3_COMMIT"
          git -C "$AK3" checkout -q FETCH_HEAD
          rm -rf "$AK3/.git" "$AK3/.github" "$AK3/README.md" "$AK3/modules" "$AK3/patch" "$AK3/ramdisk"
          curl -fsSL --retry 5 -o "$AK3/banner" \
            https://raw.githubusercontent.com/dopaemon/Anykernel3/master/banner
          sed -i -e 's/5\.10\.y - GKI/6.6.y - SM8450 Kleaf/' "$AK3/banner"
          KERNEL_STRING="DoraCore SM8450 6.6 (${{ github.event.inputs.BOOT_KERNEL }}) for $DEVICE by dopaemon"
          sed -e "s|@DEVICE@|$DEVICE|" -e "s|@KERNEL_STRING@|$KERNEL_STRING|" \
            tools/ci/sm8450_anykernel.sh > "$AK3/anykernel.sh"
          cp -r "$PACK_OUT"/. "$AK3/"
          cd "$AK3"
          find . -type f ! -name '*.ko' | sort
          ZIP_NAME="DoraCore-${DEVICE}-SM8450-6.6-${{ github.event.inputs.BOOT_KERNEL }}-AK3-${BUILD_DATE}.zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '.git*'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create_release.outputs.tag }}
          draft: ${{ github.event.inputs.RELEASE == 'draft' }}
          prerelease: ${{ github.event.inputs.RELEASE == 'prerelease' }}
          make_latest: ${{ github.event.inputs.RELEASE == 'release' }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.DEVICE }}-sm8450-logs
          path: ${{ github.workspace }}/build-*.log
          if-no-files-found: ignore
